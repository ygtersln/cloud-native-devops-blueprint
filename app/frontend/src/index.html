<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Task Tracker (Enterprise Demo)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .input-group { display: flex; margin-bottom: 20px; }
        input[type="text"] { flex-grow: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px 0 0 4px; font-size: 16px; }
        button { padding: 10px 20px; background-color: #3498db; color: white; border: none; border-radius: 0 4px 4px 0; cursor: pointer; font-size: 16px; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        .task-list { list-style-type: none; padding: 0; }
        .task-item { background: #ecf0f1; margin-bottom: 10px; padding: 15px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .footer { text-align: center; margin-top: 30px; font-size: 12px; color: #7f8c8d; }
        .status { text-align: center; margin-bottom: 15px; font-size: 14px; color: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Enterprise DevOps Tracker</h1>
        <div class="status" id="status">Checking backend connection...</div>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Enter a new infrastructure task...">
            <button onclick="addTask()">Add Task</button>
        </div>
        
        <ul class="task-list" id="taskList">
            <!-- Tasks will be loaded here -->
        </ul>
    </div>
    
    <div class="footer">
        Powered by Istio, ArgoCD, and Kubernetes ☸️
    </div>

    <script>
        // In a real environment, this might be injected or relative
        const API_URL = '/api/tasks';
        
        async function fetchTasks() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const tasks = await response.json();
                
                const list = document.getElementById('taskList');
                list.innerHTML = '';
                
                tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.className = 'task-item';
                    const date = new Date(task.created_at).toLocaleString();
                    li.innerHTML = `<span>${task.content}</span><small style="color:#95a5a6">${date}</small>`;
                    list.appendChild(li);
                });
                
                document.getElementById('status').innerText = '✅ Connected to Backend & Redis';
                document.getElementById('status').style.color = '#27ae60';
            } catch (error) {
                console.error('Error fetching tasks:', error);
                document.getElementById('status').innerText = '❌ Backend connection failed (Check Istio/Ingress)';
            }
        }

        async function addTask() {
            const input = document.getElementById('taskInput');
            const content = input.value.trim();
            if (!content) return;
            
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content })
                });
                
                input.value = '';
                fetchTasks();
            } catch (error) {
                console.error('Error adding task:', error);
                alert('Failed to add task');
            }
        }

        // Initial load
        fetchTasks();
    </script>
</body>
</html>
