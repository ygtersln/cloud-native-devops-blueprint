name: 'Application CI & GitOps'

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'

jobs:
  build-and-push:
    name: 'Build, Scan & Push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: app/go.sum

      - name: Run Unit Tests
        run: go test ./...
        working-directory: ./app

      - name: Build Docker Image
        run: docker build -t ghcr.io/${{ github.repository }}/app:${{ github.sha }} ./app

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push ghcr.io/${{ github.repository }}/app:${{ github.sha }}

      - name: Update Kustomize Image Tag (True GitOps)
        run: |
          cd kubernetes/app/base
          kustomize edit set image blueprint-app=ghcr.io/${{ github.repository }}/app:${{ github.sha }}
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git commit -am "ci: update application image tag to ${{ github.sha }}"
          git push origin main
