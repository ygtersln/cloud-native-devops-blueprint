name: 'Application CI & GitOps'

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'

jobs:
  build-and-push:
    name: 'Build, Scan & Push (3-Tier App)'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        run: |
          docker build -t ghcr.io/${{ github.repository }}/backend:${{ github.sha }} ./app/backend
          docker push ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build & Push Frontend
        run: |
          docker build -t ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} ./app/frontend
          docker push ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

      - name: Run Trivy Vulnerability Scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Update Kustomize Image Tags (True GitOps)
        run: |
          cd kubernetes/app/base
          kustomize edit set image blueprint-backend=ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          kustomize edit set image blueprint-frontend=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git commit -am "ci: update application image tags to ${{ github.sha }}"
          git push origin main
