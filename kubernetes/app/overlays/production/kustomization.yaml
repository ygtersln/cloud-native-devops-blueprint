apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: prod-
commonLabels:
  env: production

patches:
  - target:
      kind: Deployment
      name: blueprint-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: blueprint-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
