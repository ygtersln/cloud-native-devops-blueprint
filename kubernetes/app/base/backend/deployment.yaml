apiVersion: apps/v1
kind: Deployment
metadata:
  name: blueprint-backend
  labels:
    app: blueprint-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blueprint-backend
  template:
    metadata:
      labels:
        app: blueprint-backend
    spec:
      containers:
        - name: backend
          image: blueprint-backend:latest
          env:
            - name: REDIS_HOST
              value: "blueprint-redis:6379"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: blueprint-backend
  labels:
    app: blueprint-backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: blueprint-backend
