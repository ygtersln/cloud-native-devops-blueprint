apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keycloak

helmCharts:
  - name: keycloak
    repo: https://charts.bitnami.com/bitnami
    version: 21.1.0
    releaseName: keycloak
    valuesInline:
      auth:
        adminUser: admin
        # In a real environment, this should be referenced from Vault or a Secret
        adminPassword: "changeme"
      postgresql:
        enabled: true
