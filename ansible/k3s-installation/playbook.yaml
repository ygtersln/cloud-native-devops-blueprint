---
- name: Bootstrap Bare-Metal K3s Cluster
  hosts: all
  become: yes
  tasks:
    - name: Set timezone to Europe/Istanbul
      timezone:
        name: Europe/Istanbul

    - name: Install essential packages (curl, wget, chrony, git)
      apt:
        name: 
          - curl
          - wget
          - chrony
          - git
        state: present
        update_cache: yes
      when: ansible_os_family == 'Debian'

    - name: Ensure Chrony (NTP) is running
      systemd:
        name: chrony
        state: started
        enabled: yes

    # Note: In a real-world scenario, we would use the official k3s-ansible role.
    # This playbook is a simplified representation of the bootstrap process.
    - name: Download and install K3s
      shell: "curl -sfL https://get.k3s.io | sh -"
      args:
        creates: /usr/local/bin/k3s

    - name: Ensure K3s is running
      systemd:
        name: k3s
        state: started
        enabled: yes
