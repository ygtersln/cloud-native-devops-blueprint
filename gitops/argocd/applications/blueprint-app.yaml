apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-native-devops-blueprint
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ygtersln/cloud-native-devops-blueprint.git'
    path: kubernetes/app
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: blueprint-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
